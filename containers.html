<!DOCTYPE html>

    <title>Container Examples</title>

<body>
    <h1>HTML Containers</h1>
    <div class="definitions">
        <h2>Container</h2>
        <p>Any element with an opening and closing tag that holds content.</p>
        <h2>&lt;div&gt;</h2>
        <p>Generic block container with no meaning of its own.</p>
        <h2>&lt;span&gt;</h2>
        <p>Generic inline container with no meaning of its own.</p>
    </div>
</body>
